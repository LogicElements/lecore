name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / pymodbus ${{ matrix.pymodbus }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.14"]
        include:
          - python: "3.9"
            pymodbus: "2.x"
            pymodbus-req: "pymodbus>=2.5,<3"
          - python: "3.14"
            pymodbus: "latest"
            pymodbus-req: "pymodbus>=3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Tests run against the installed wheel, so missing package data is detected
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl pytest "${{ matrix.pymodbus-req }}"
      # Only tests without hardware (COM port devices) and network (Looger server)
      - name: Test
        run: python -m pytest -q tests/test_scaffold.py tests/test_devices.py tests/test_byte_order.py tests/test_device_suite.py
