[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lecore"
description = "Logic Elements core utilities"
version = "0.2.7"
authors = [
  { name="Jan Bartovský", email="jan.bartovsky@logicelements.cz" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["logicelements", "looger", "development"]


requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "pymodbus>=2.5",
    "unittest-xml-reporting",
]

[project.scripts]
lecore = "lecore.__main__:main"

[project.entry-points.pytest11]
lecore = "lecore.DeviceTests.Plugin"

[project.optional-dependencies]
extra = [
    "FreeSimpleGUI",
    "python-docx",
]
tui = ["textual"]
dev = [
    "pytest",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lecore" = ["py.typed", "QUICKSTART.md"]
"lecore.Devices.RtdEmul" = ["*.json"]
"lecore.Devices.VmsRtd" = ["*.json"]
"lecore.Devices.PhaseDet" = ["*.json"]
"lecore.Devices.Rftb" = ["*.json"]
"lecore.VisualModbus" = ["*.tcss"]

[project.urls]
"Homepage" = "https://github.com/LogicElements/lecore"
"Issues" = "https://github.com/LogicElements/lecore/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
